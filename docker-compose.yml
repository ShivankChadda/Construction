# One small server (1 vCPU / 1 GB is plenty). Point your domain's DNS at it,
# set DOMAIN in .env, then: docker compose up -d
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data            # database, PDFs, signing key, backups — back this up
      - ./config/roster.yaml:/app/config/roster.yaml:ro

  caddy:                            # automatic HTTPS (Meta requires https for webhooks)
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [bot]

volumes:
  caddy_data:
