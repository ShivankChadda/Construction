[project]
name = "purchasebot"
version = "0.1.0"
description = "WhatsApp purchase-approval bot for multi-site construction: requisitions, purchase slips, signed approvals, Drive/Sheets log, site stock."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "cryptography>=42",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pymupdf>=1.24"]

[project.scripts]
purchasebot = "purchasebot.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
